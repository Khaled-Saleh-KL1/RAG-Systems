<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Vision - مساعد البيانات</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-sidebar: #0c1222;
            --bg-input: #0f172a;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --user-msg: #1e3a5f;
            --bot-msg: #1e293b;
            --success: #22c55e;
            --error: #ef4444;
            --teach: #f59e0b;
            --teach-bg: rgba(245, 158, 11, 0.1);
            --sidebar-w: 300px;
        }

        body {
            font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        #root {
            height: 100vh;
        }

        .app-layout {
            display: flex;
            height: 100%;
            position: relative;
        }

        /* ========== SIDEBAR ========== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .sidebar-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sidebar-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .sidebar-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-new-chat {
            margin: 12px 16px;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .sidebar-new-chat:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .sidebar-list::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .conv-item {
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: all 0.15s;
            margin-bottom: 2px;
        }

        .conv-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .conv-item.active {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .conv-item-text {
            flex: 1;
            min-width: 0;
        }

        .conv-item-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-item-date {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .conv-delete {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            opacity: 0;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .conv-item:hover .conv-delete {
            opacity: 1;
        }

        .conv-delete:hover {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .sidebar-empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 16px;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ========== MAIN AREA ========== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: var(--user-msg);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .message.bot {
            background: var(--bot-msg);
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .teach-box {
            max-width: 75%;
            align-self: flex-end;
            background: var(--teach-bg);
            border: 1px solid var(--teach);
            border-radius: 16px;
            padding: 16px 18px;
            animation: fadeIn 0.3s ease;
        }

        .teach-box .teach-label {
            font-size: 13px;
            color: var(--teach);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .teach-box textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s;
        }

        .teach-box textarea:focus {
            border-color: var(--teach);
        }

        .teach-box textarea::placeholder {
            color: var(--text-secondary);
        }

        .teach-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: flex-start;
        }

        .teach-submit {
            padding: 8px 20px;
            background: var(--teach);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .teach-submit:hover {
            opacity: 0.9;
        }

        .teach-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .teach-skip {
            padding: 8px 16px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }

        .teach-skip:hover {
            border-color: var(--text-secondary);
        }

        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-area input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            padding: 14px 28px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 200;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .status-toast.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-toast.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .status-toast.info {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent-hover);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 12px;
        }

        .empty-state .icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            align-self: flex-end;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-8px);
            }
        }

        .hidden-input {
            display: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const API_BASE = window.location.origin;

        function genUUID() {
            return crypto.randomUUID ? crypto.randomUUID() :
                'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                });
        }

        function getUserId() {
            let id = localStorage.getItem('jordan_vision_user_id');
            if (!id) {
                id = genUUID();
                localStorage.setItem('jordan_vision_user_id', id);
            }
            return id;
        }

        function App() {
            const userId = useRef(getUserId()).current;
            const [conversations, setConversations] = useState([]);
            const [activeConvId, setActiveConvId] = useState(null);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [toast, setToast] = useState(null);
            const [teachState, setTeachState] = useState(null);
            const [teachInput, setTeachInput] = useState('');
            const [teachLoading, setTeachLoading] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const chatRef = useRef(null);
            const fileRef = useRef(null);

            // Load conversations list
            const loadConversations = useCallback(async () => {
                try {
                    const res = await fetch(`${API_BASE}/qa/conversations/${userId}`);
                    const data = await res.json();
                    setConversations(data.conversations || []);
                } catch (err) {
                    console.error('Failed to load conversations:', err);
                }
            }, [userId]);

            // Load on mount
            useEffect(() => {
                const init = async () => {
                    await loadConversations();
                    // Restore last active conversation
                    const lastConvId = localStorage.getItem('jordan_vision_active_conv');
                    if (lastConvId) {
                        setActiveConvId(lastConvId);
                    }
                };
                init();
            }, []);

            // Load messages when active conversation changes
            useEffect(() => {
                if (!activeConvId) {
                    setMessages([]);
                    return;
                }
                localStorage.setItem('jordan_vision_active_conv', activeConvId);
                const loadMessages = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/qa/history/${activeConvId}`);
                        const data = await res.json();
                        if (data.messages && data.messages.length > 0) {
                            setMessages(data.messages.map(m => ({
                                role: m.role,
                                text: m.content
                            })));
                        } else {
                            setMessages([]);
                        }
                    } catch (err) {
                        console.error('Failed to load messages:', err);
                    }
                };
                loadMessages();
            }, [activeConvId]);

            // Auto-scroll
            useEffect(() => {
                if (chatRef.current) {
                    chatRef.current.scrollTop = chatRef.current.scrollHeight;
                }
            }, [messages, loading, teachState]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Create a new conversation
            const handleNewChat = async () => {
                try {
                    const res = await fetch(`${API_BASE}/qa/conversations`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId })
                    });
                    const conv = await res.json();
                    setActiveConvId(conv.id);
                    setMessages([]);
                    setTeachState(null);
                    setTeachInput('');
                    setSidebarOpen(false);
                    await loadConversations();
                } catch (err) {
                    showToast('فشل إنشاء محادثة جديدة', 'error');
                }
            };

            // Switch to conversation
            const switchConversation = (convId) => {
                setActiveConvId(convId);
                setTeachState(null);
                setTeachInput('');
                setSidebarOpen(false);
            };

            // Delete a conversation
            const deleteConversation = async (convId, e) => {
                e.stopPropagation();
                try {
                    await fetch(`${API_BASE}/qa/conversations/${convId}`, { method: 'DELETE' });
                    if (activeConvId === convId) {
                        setActiveConvId(null);
                        setMessages([]);
                        localStorage.removeItem('jordan_vision_active_conv');
                    }
                    await loadConversations();
                } catch (err) {
                    showToast('فشل حذف المحادثة', 'error');
                }
            };

            const sendMessage = async () => {
                if (!input.trim() || loading) return;

                // If no active conversation, create one first
                let convId = activeConvId;
                if (!convId) {
                    try {
                        const res = await fetch(`${API_BASE}/qa/conversations`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user_id: userId })
                        });
                        const conv = await res.json();
                        convId = conv.id;
                        setActiveConvId(convId);
                    } catch (err) {
                        showToast('فشل إنشاء المحادثة', 'error');
                        return;
                    }
                }

                const question = input.trim();
                setInput('');
                setTeachState(null);
                setMessages(prev => [...prev, { role: 'user', text: question }]);
                setLoading(true);

                try {
                    const res = await fetch(`${API_BASE}/qa/ask`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question, conversation_id: convId, user_id: userId })
                    });
                    const data = await res.json();
                    const msgIndex = messages.length + 1;
                    setMessages(prev => [...prev, {
                        role: 'bot',
                        text: data.answer,
                        knowsAnswer: data.knows_answer
                    }]);

                    if (!data.knows_answer) {
                        setTeachState({ question, index: msgIndex });
                    }

                    // Refresh conversations list (title may have been auto-set)
                    await loadConversations();
                } catch (err) {
                    setMessages(prev => [...prev, { role: 'bot', text: 'حدث خطأ في الاتصال بالخادم.', knowsAnswer: true }]);
                } finally {
                    setLoading(false);
                }
            };

            const handleTeach = async () => {
                if (!teachInput.trim() || !teachState || !activeConvId) return;

                setTeachLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/qa/teach`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question: teachState.question,
                            answer: teachInput.trim(),
                            conversation_id: activeConvId
                        })
                    });
                    const data = await res.json();
                    showToast(data.message, 'success');
                    setTeachState(null);
                    setTeachInput('');
                } catch (err) {
                    showToast('فشل حفظ الإجابة.', 'error');
                } finally {
                    setTeachLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const handleUpload = async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                setUploading(true);
                showToast('جاري رفع الملفات ومعالجتها...', 'info');
                const formData = new FormData();
                formData.append('project_id', 'default');
                for (let f of files) formData.append('files', f);

                try {
                    const res = await fetch(`${API_BASE}/data/upload/`, { method: 'POST', body: formData });
                    const data = await res.json();
                    showToast('تم رفع الملفات بنجاح! جاري المعالجة في الخلفية...', 'success');
                } catch (err) {
                    showToast('فشل رفع الملفات.', 'error');
                } finally {
                    setUploading(false);
                    if (fileRef.current) fileRef.current.value = '';
                }
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                const now = new Date();
                const diffMs = now - d;
                const diffMins = Math.floor(diffMs / 60000);
                if (diffMins < 1) return 'الآن';
                if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
                const diffHours = Math.floor(diffMins / 60);
                if (diffHours < 24) return `منذ ${diffHours} ساعة`;
                const diffDays = Math.floor(diffHours / 24);
                if (diffDays < 7) return `منذ ${diffDays} يوم`;
                return d.toLocaleDateString('ar');
            };

            return (
                <div className="app-layout">
                    {toast && (
                        <div className={`status-toast ${toast.type}`}>
                            {toast.message}
                        </div>
                    )}

                    {/* Sidebar overlay */}
                    <div
                        className={`sidebar-overlay ${sidebarOpen ? 'visible' : ''}`}
                        onClick={() => setSidebarOpen(false)}
                    />

                    {/* Sidebar */}
                    <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                        <div className="sidebar-header">
                            <h2>💬 المحادثات</h2>
                            <button className="sidebar-close" onClick={() => setSidebarOpen(false)}>✕</button>
                        </div>
                        <button className="sidebar-new-chat" onClick={handleNewChat}>
                            ✨ محادثة جديدة
                        </button>
                        <div className="sidebar-list">
                            {conversations.length === 0 ? (
                                <div className="sidebar-empty">
                                    لا توجد محادثات بعد.<br />ابدأ محادثة جديدة!
                                </div>
                            ) : (
                                conversations.map(conv => (
                                    <div
                                        key={conv.id}
                                        className={`conv-item ${activeConvId === conv.id ? 'active' : ''}`}
                                        onClick={() => switchConversation(conv.id)}
                                    >
                                        <div className="conv-item-text">
                                            <div className="conv-item-title">{conv.title}</div>
                                            <div className="conv-item-date">{formatDate(conv.updated_at)}</div>
                                        </div>
                                        <button
                                            className="conv-delete"
                                            onClick={(e) => deleteConversation(conv.id, e)}
                                            title="حذف المحادثة"
                                        >
                                            🗑
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    {/* Main content */}
                    <div className="main-area">
                        <div className="header">
                            <div className="header-right">
                                <button className="icon-btn" onClick={() => setSidebarOpen(true)} title="المحادثات السابقة">
                                    ☰
                                </button>
                                <div>
                                    <h1>Jordan Vision - مساعد البيانات</h1>
                                    <div className="subtitle">اسأل عن محتوى الملفات المرفوعة</div>
                                </div>
                            </div>
                            <div className="header-actions">
                                <input
                                    ref={fileRef}
                                    type="file"
                                    accept=".pdf"
                                    multiple
                                    className="hidden-input"
                                    onChange={handleUpload}
                                />
                                <button
                                    className="upload-btn"
                                    onClick={() => fileRef.current?.click()}
                                    disabled={uploading}
                                >
                                    📄 {uploading ? 'جاري الرفع...' : 'رفع ملف PDF'}
                                </button>
                            </div>
                        </div>

                        <div className="chat-container" ref={chatRef}>
                            {messages.length === 0 && !loading && (
                                <div className="empty-state">
                                    <div className="icon">💬</div>
                                    <p>ابدأ بطرح سؤال حول البيانات المخزنة</p>
                                    <p style={{ fontSize: '13px' }}>أو ارفع ملف PDF جديد للبدء</p>
                                </div>
                            )}

                            {messages.map((msg, i) => (
                                <div key={i} className={`message ${msg.role}`}>
                                    <div className="label">
                                        {msg.role === 'user' ? '👤 أنت' : '🤖 المساعد'}
                                    </div>
                                    {msg.text}
                                </div>
                            ))}

                            {loading && (
                                <div className="typing-indicator">
                                    <span></span><span></span><span></span>
                                </div>
                            )}

                            {teachState && !loading && (
                                <div className="teach-box">
                                    <div className="teach-label">
                                        📝 لم أجد الإجابة — هل تعرف الجواب؟
                                    </div>
                                    <textarea
                                        value={teachInput}
                                        onChange={(e) => setTeachInput(e.target.value)}
                                        placeholder="اكتب الإجابة الصحيحة هنا..."
                                        disabled={teachLoading}
                                    />
                                    <div className="teach-actions">
                                        <button
                                            className="teach-submit"
                                            onClick={handleTeach}
                                            disabled={teachLoading || !teachInput.trim()}
                                        >
                                            {teachLoading ? 'جاري الحفظ...' : '💾 حفظ الإجابة'}
                                        </button>
                                        <button
                                            className="teach-skip"
                                            onClick={() => { setTeachState(null); setTeachInput(''); }}
                                        >
                                            تخطي
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="input-area">
                            <input
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={handleKeyDown}
                                placeholder="اكتب سؤالك هنا..."
                                disabled={loading}
                            />
                            <button
                                className="send-btn"
                                onClick={sendMessage}
                                disabled={loading || !input.trim()}
                            >
                                إرسال
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
