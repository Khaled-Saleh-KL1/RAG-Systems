<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Vision - مساعد البيانات</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --user-msg: #1e3a5f;
            --bot-msg: #1e293b;
            --success: #22c55e;
            --error: #ef4444;
            --teach: #f59e0b;
            --teach-bg: rgba(245, 158, 11, 0.1);
        }

        body {
            font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        #root {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: var(--user-msg);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .message.bot {
            background: var(--bot-msg);
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* Teach box */
        .teach-box {
            max-width: 75%;
            align-self: flex-end;
            background: var(--teach-bg);
            border: 1px solid var(--teach);
            border-radius: 16px;
            padding: 16px 18px;
            animation: fadeIn 0.3s ease;
        }

        .teach-box .teach-label {
            font-size: 13px;
            color: var(--teach);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .teach-box textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s;
        }

        .teach-box textarea:focus {
            border-color: var(--teach);
        }

        .teach-box textarea::placeholder {
            color: var(--text-secondary);
        }

        .teach-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: flex-start;
        }

        .teach-submit {
            padding: 8px 20px;
            background: var(--teach);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .teach-submit:hover {
            opacity: 0.9;
        }

        .teach-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .teach-skip {
            padding: 8px 16px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }

        .teach-skip:hover {
            border-color: var(--text-secondary);
        }

        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-area input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            padding: 14px 28px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .status-toast.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-toast.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .status-toast.info {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent-hover);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 12px;
        }

        .empty-state .icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            align-self: flex-end;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-8px);
            }
        }

        .hidden-input {
            display: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const API_BASE = window.location.origin;

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [toast, setToast] = useState(null);
            const [teachState, setTeachState] = useState(null); // { question, index }
            const [teachInput, setTeachInput] = useState('');
            const [teachLoading, setTeachLoading] = useState(false);
            const chatRef = useRef(null);
            const fileRef = useRef(null);

            useEffect(() => {
                if (chatRef.current) {
                    chatRef.current.scrollTop = chatRef.current.scrollHeight;
                }
            }, [messages, loading, teachState]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const sendMessage = async () => {
                if (!input.trim() || loading) return;

                const question = input.trim();
                setInput('');
                setTeachState(null);
                setMessages(prev => [...prev, { role: 'user', text: question }]);
                setLoading(true);

                try {
                    const res = await fetch(`${API_BASE}/qa/ask`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question })
                    });
                    const data = await res.json();
                    const msgIndex = messages.length + 1; // +1 for the user msg we just added
                    setMessages(prev => [...prev, {
                        role: 'bot',
                        text: data.answer,
                        knowsAnswer: data.knows_answer
                    }]);

                    // If the LLM doesn't know, show teach box
                    if (!data.knows_answer) {
                        setTeachState({ question, index: msgIndex });
                    }
                } catch (err) {
                    setMessages(prev => [...prev, { role: 'bot', text: 'حدث خطأ في الاتصال بالخادم.', knowsAnswer: true }]);
                } finally {
                    setLoading(false);
                }
            };

            const handleTeach = async () => {
                if (!teachInput.trim() || !teachState) return;

                setTeachLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/qa/teach`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question: teachState.question,
                            answer: teachInput.trim()
                        })
                    });
                    const data = await res.json();
                    showToast(data.message, 'success');
                    setTeachState(null);
                    setTeachInput('');
                } catch (err) {
                    showToast('فشل حفظ الإجابة.', 'error');
                } finally {
                    setTeachLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const handleUpload = async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                setUploading(true);
                showToast('جاري رفع الملفات ومعالجتها...', 'info');

                const formData = new FormData();
                formData.append('project_id', 'default');
                for (let f of files) {
                    formData.append('files', f);
                }

                try {
                    const res = await fetch(`${API_BASE}/data/upload/`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    showToast('تم رفع الملفات بنجاح! جاري المعالجة في الخلفية...', 'success');
                } catch (err) {
                    showToast('فشل رفع الملفات.', 'error');
                } finally {
                    setUploading(false);
                    if (fileRef.current) fileRef.current.value = '';
                }
            };

            return (
                <div className="app-wrapper">
                    {toast && (
                        <div className={`status-toast ${toast.type}`}>
                            {toast.message}
                        </div>
                    )}

                    <div className="header">
                        <div>
                            <h1>Jordan Vision - مساعد البيانات</h1>
                            <div className="subtitle">اسأل عن محتوى الملفات المرفوعة</div>
                        </div>
                        <div>
                            <input
                                ref={fileRef}
                                type="file"
                                accept=".pdf"
                                multiple
                                className="hidden-input"
                                onChange={handleUpload}
                            />
                            <button
                                className="upload-btn"
                                onClick={() => fileRef.current?.click()}
                                disabled={uploading}
                            >
                                📄 {uploading ? 'جاري الرفع...' : 'رفع ملف PDF'}
                            </button>
                        </div>
                    </div>

                    <div className="chat-container" ref={chatRef}>
                        {messages.length === 0 && !loading && (
                            <div className="empty-state">
                                <div className="icon">💬</div>
                                <p>ابدأ بطرح سؤال حول البيانات المخزنة</p>
                                <p style={{ fontSize: '13px' }}>أو ارفع ملف PDF جديد للبدء</p>
                            </div>
                        )}

                        {messages.map((msg, i) => (
                            <div key={i} className={`message ${msg.role}`}>
                                <div className="label">
                                    {msg.role === 'user' ? '👤 أنت' : '🤖 المساعد'}
                                </div>
                                {msg.text}
                            </div>
                        ))}

                        {loading && (
                            <div className="typing-indicator">
                                <span></span><span></span><span></span>
                            </div>
                        )}

                        {teachState && !loading && (
                            <div className="teach-box">
                                <div className="teach-label">
                                    📝 لم أجد الإجابة — هل تعرف الجواب؟
                                </div>
                                <textarea
                                    value={teachInput}
                                    onChange={(e) => setTeachInput(e.target.value)}
                                    placeholder="اكتب الإجابة الصحيحة هنا..."
                                    disabled={teachLoading}
                                />
                                <div className="teach-actions">
                                    <button
                                        className="teach-submit"
                                        onClick={handleTeach}
                                        disabled={teachLoading || !teachInput.trim()}
                                    >
                                        {teachLoading ? 'جاري الحفظ...' : '💾 حفظ الإجابة'}
                                    </button>
                                    <button
                                        className="teach-skip"
                                        onClick={() => { setTeachState(null); setTeachInput(''); }}
                                    >
                                        تخطي
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="input-area">
                        <input
                            type="text"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder="اكتب سؤالك هنا..."
                            disabled={loading}
                        />
                        <button
                            className="send-btn"
                            onClick={sendMessage}
                            disabled={loading || !input.trim()}
                        >
                            إرسال
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
